minimum_pre_commit_version: 4.6.1
exclude: '(^|/)(_archive|scripts|theme)(/|$)'

repos:
  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: 358bd98f7d9d33fefe5a148875d1d61e7e558f2d  # frozen: v0.2.62
    hooks:
      - id: rumdl
        files: '^(src/.*\.md|README\.md|CONTRIBUTING\.md|AGENTS\.md)'

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
        exclude: '^src/_[^/]+/'
      - id: trailing-whitespace
        entry: trailing-whitespace-fixer
        exclude: '^src/_[^/]+/'

  - repo: https://github.com/lycheeverse/lychee
    rev: 2bba271688c1abb1503097a064e6c3bc1d1b6a9b # frozen: lychee-v0.24.2
    hooks:
      - id: lychee
        alias: lychee-local
        name: check local links
        args: [ "--offline", "--no-progress" ]
        files: '^(src/.*\.md|README\.md|CONTRIBUTING\.md|AGENTS\.md)'
        exclude: '^src/SUMMARY\.md$' # mdBook permits empty draft links.
      - id: lychee
        alias: lychee-external
        name: check external links
        args: [ "--no-progress", "--max-retries", "3" ]
        files: '^(src/.*\.md|README\.md|CONTRIBUTING\.md|AGENTS\.md)'
        exclude: '^src/SUMMARY\.md$' # mdBook permits empty draft links.
        stages: [ manual ]
      - id: lychee
        alias: lychee-html
        name: check generated HTML links
        args:
          - "--offline"
          - "--no-progress"
          - "--root-dir=book/html"
          - "--fallback-extensions=html"
          - "--index-files=index.html"
          - "--include-fragments=anchor-only"
          - "book/html"
        always_run: true
        pass_filenames: false
        stages: [ manual ]
